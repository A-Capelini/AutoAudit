name: autoaudit
channels:
  - conda-forge
dependencies:
  - python=3.11
  # --- pacotes com build binário pesado: melhor via conda-forge ---
  - faiss-cpu
  - pymongo
  - requests
  - python-dotenv
  - pypdf
  - beautifulsoup4
  - lxml
  - fastapi
  - uvicorn
  - streamlit
  - pip
  - pip:
      # torch: força a build CPU-only (sua máquina não tem GPU dedicada —
      # sem isso, o pip baixa a build com CUDA, maior e inútil aqui)
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      # --- pacotes que mudam rápido / não têm build atualizada no conda-forge ---
      - sentence-transformers
      - langchain
      - langchain-community
      - python-nmap
